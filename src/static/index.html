<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Portal | Premium Ticket Submission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-dim);
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            color: var(--text-dim);
            transition: color 0.3s ease;
        }

        input,
        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #response-msg {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 12px;
            display: none;
            font-size: 0.875rem;
            text-align: center;
        }

        .success {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .container {
                padding: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
            <!-- Stylized Noavia Logo -->
            <div
                style="background: linear-gradient(135deg, #6366f1, #c084fc); width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 1.5rem; font-family: 'Outfit';">
                N</div>
            <div>
                <h1 style="font-size: 1.75rem; margin-bottom: 0;">Noavia AI Ticketing System</h1>
                <p class="subtitle" style="margin-bottom: 0; font-size: 0.9rem;">Powered by Noavia Process Intelligence
                </p>
            </div>
        </header>

        <form id="support-form">
            <div class="row">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="Name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="Email" placeholder="john@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="Subject" placeholder="How can we help?" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="Message" rows="3" placeholder="Describe your issue in detail..."
                    required></textarea>
            </div>

            <div class="form-group">
                <label for="attachment">Attachment (Optional PDF)</label>
                <input type="file" id="attachment" name="Attachment" accept="application/pdf">
                <p style="font-size: 0.75rem; color: var(--text-dim); margin-top: 0.25rem;">Max 10MB. PDF only.</p>
            </div>

            <div class="form-group">
                <label for="supervisor-email">Supervisor Email (Direct Receipt)</label>
                <input type="email" id="supervisor-email" name="supervisor-email" placeholder="manager@company.com"
                    required>
            </div>

            <button type="submit" id="submit-btn" style="margin-top: 0.5rem;">
                <span id="btn-text">Submit Request</span>
                <div class="loader" id="btn-loader"></div>
            </button>
        </form>

        <div id="response-msg"></div>

        <div
            style="margin-top: 2.5rem; border-top: 1px solid var(--glass-border); padding-top: 1.5rem; text-align: center;">
            <p style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 1rem;">ADMIN</p>
            <a href="https://docs.google.com/spreadsheets/d/1hkOV9jvLJG7HPW6lyuJuMY9ju-9P_QgMzrLYV6ENaSE/edit?usp=sharing"
                target="_blank"
                style="display: inline-flex; align-items: center; gap: 0.5rem; color: #4ade80; text-decoration: none; font-size: 0.875rem; font-weight: 500; padding: 0.5rem 1rem; border: 1px solid rgba(74, 222, 128, 0.2); border-radius: 8px; background: rgba(34, 197, 94, 0.05); transition: all 0.3s ease;">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path
                        d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5v2z" />
                    <path
                        d="M4.5 12h7a.5.5 0 0 0 0-1h-7a.5.5 0 0 0 0 1zm0-2h7a.5.5 0 0 0 0-1h-7a.5.5 0 0 0 0 1zm0-2h7a.5.5 0 0 0 0-1h-7a.5.5 0 0 0 0 1zm0-2h7a.5.5 0 0 0 0-1h-7a.5.5 0 0 0 0 1z" />
                </svg>
                View Tracking Google Sheets
            </a>
        </div>
    </div>

    <script>
        const form = document.getElementById('support-form');
        const btn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');
        const responseMsg = document.getElementById('response-msg');

        const N8N_WEBHOOK_URL = '/webhook/support-ticket'; // Standard n8n production path

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // UI State
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';
            btn.disabled = true;
            responseMsg.style.display = 'none';

            const formData = new FormData(form);
            // N8N receives files automatically when using FormData

            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    body: formData // Use FormData directly for multipart/form-data
                });

                const result = await response.json();

                if (response.ok) {
                    responseMsg.innerText = 'Ticket submitted successfully! ID: ' + (result.ticket_id || 'N/A');
                    responseMsg.className = 'success';
                    form.reset();
                } else {
                    throw new Error(result.message || 'Submission failed');
                }
            } catch (err) {
                responseMsg.innerText = 'Error: ' + err.message;
                responseMsg.className = 'error';
            } finally {
                btnText.style.display = 'block';
                btnLoader.style.display = 'none';
                btn.disabled = false;
                responseMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
